[build]
  command = "npm run build"
  publish = ".next"

# Netlify Next.js runtime — enable in site plugins: @netlify/plugin-nextjs

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Long cache for immutable hashed assets (egress savings)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Soft rate-limit hints for analytics (browser still controls cadence)
[[headers]]
  for = "/api/analytics/*"
  [headers.values]
    Cache-Control = "no-store"
